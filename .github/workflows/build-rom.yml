name: Build host readiness (no ROM compile)

on:
  workflow_dispatch:
    inputs:
      target_device:
        description: 'Must be gtaxllte (Samsung SM-T585 LTE).'
        required: true
        default: 'gtaxllte'
        type: string
      candidate_branch:
        description: 'Candidate crDroid branch. 8.0 is the Android 12/12L-era experiment; not yet release-approved.'
        required: true
        default: '8.0'
        type: string

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Validate intended target and source candidate
        env:
          TARGET_DEVICE: ${{ inputs.target_device }}
          CRDROID_BRANCH: ${{ inputs.candidate_branch }}
        run: |
          test "$TARGET_DEVICE" = "gtaxllte" || {
            echo 'ERROR: this project only targets gtaxllte / SM-T585, not gtaxlwifi / SM-T580.' >&2
            exit 2
          }
          test "$CRDROID_BRANCH" = "8.0" || {
            echo 'ERROR: only the 8.0 Android 12/12L-era candidate is listed for this initial readiness check.' >&2
            echo 'Do not build crDroid 17.0 against this legacy device tree without a separate compatibility port.' >&2
            exit 3
          }
          bash -n scripts/preflight.sh
          TARGET_DEVICE="$TARGET_DEVICE" TARGET_MODEL="SM-T585" CRDROID_BRANCH="$CRDROID_BRANCH" ./scripts/preflight.sh
      - name: Explain free runner limits
        run: |
          echo 'PASS: lightweight project checks completed.'
          echo 'NO ROM BUILD WAS RUN.'
          echo 'GitHub standard public runner: 4 CPUs, 16 GB RAM, 14 GB SSD; full Android builds typically need hundreds of GB of SSD.'
          echo 'Continue with a suitably provisioned trusted self-hosted Linux runner when one is available at no additional cost.'
